
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADALUANG — Ayo Dalami Peluang</title>
<style>
:root{--p:#7856c8;--bg:#faf8ff;--ink:#29233d;--muted:#777188}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:20px 7%;background:white;border-bottom:1px solid #eee8fa;font-weight:bold;font-size:22px}
header span{color:var(--p)}
header small{display:block;font-size:9px;letter-spacing:2px;color:var(--muted);margin-top:5px}
main{width:min(900px,90%);margin:40px auto}
.hero{text-align:center;margin-bottom:30px}
.hero h1{font-size:clamp(34px,6vw,54px);margin:15px 0}
.hero h1 span{color:var(--p)}
.hero p{line-height:1.8;color:var(--muted)}
.card,.panel{background:white;border:1px solid #eee6fa;border-radius:20px;padding:26px;margin-bottom:18px;box-shadow:0 8px 25px #65509a0a}
.card{max-width:600px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.role{padding:25px 12px;background:#f4f0ff;border:1px solid #e9e0fa;border-radius:16px;cursor:pointer;color:var(--ink)}
.role:hover{border-color:var(--p)}
.role b,.role small{display:block;margin-top:8px}
.role small{color:var(--muted)}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:12px;border:1px solid #ded6ec;border-radius:10px;margin:7px 0 14px}
button.primary{background:var(--p);color:white;border:0;padding:12px 16px;border-radius:10px;cursor:pointer}
button.primary:disabled{opacity:.6}
button.link{display:block;border:0;background:none;color:var(--p);cursor:pointer;margin:13px auto}
.hidden{display:none!important}
.muted{color:var(--muted)}
.message{font-size:13px;overflow-wrap:anywhere}
.item{border:1px solid #eee6fa;padding:13px;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}
.item a{color:var(--p)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}
label{font-size:13px;font-weight:bold}
@media(max-width:500px){.grid{grid-template-columns:1fr}main{margin:25px auto}.card,.panel{padding:20px}}
</style>
</head>
<body>
<header>∑ <span>ADALUANG</span><small>RUANG BELAJAR MATEMATIKA</small></header>
<main>
<section class="hero">
<p>RUANG BELAJAR DIGITAL</p>
<h1>Ayo Dalami <span>Peluang!</span></h1>
<p>Belajar matematika lebih seru, interaktif, dan dekat dengan kehidupan sehari-hari.</p>
</section>

<section id="login" class="card">
<h2>Selamat datang!</h2>
<p class="muted">Pilih ruang belajarmu.</p>
<div class="grid" id="roles">
<button class="role" onclick="choose('guru')">📚<b>Ruang Guru</b><small>Kelola kelas dan materi</small></button>
<button class="role" onclick="choose('murid')">✏️<b>Ruang Murid</b><small>Pelajari materi peluang</small></button>
</div>
<form id="authform" class="hidden">
<h3 id="formtitle">Masuk</h3>
<div id="namelabel" class="hidden"><label>Nama lengkap</label><input id="name" autocomplete="name"></div>
<label>Email</label><input id="email" type="email" required autocomplete="email">
<label>Kata sandi</label><input id="password" type="password" minlength="6" required autocomplete="current-password">
<p id="message" class="message"></p>
<button class="primary" id="submit" type="submit">Masuk</button>
<button class="link" type="button" id="toggle">Belum punya akun? Daftar</button>
<button class="link" type="button" onclick="back()">Kembali</button>
</form>
</section>

<section id="dashboard" class="hidden">
<div class="topline"><div><p>ADALUANG</p><h2 id="welcome">Halo!</h2><p id="roletext" class="muted"></p></div><button class="primary" id="logout">Keluar</button></div>
<div id="content"></div>
</section>
</main>
<footer>© 2026 ADALUANG · Ayo Dalami Peluang</footer>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDuVGHdk05SzOdTGuXsqfKZZwF1dYsmQDU",
authDomain:"adaluang.firebaseapp.com",
projectId:"adaluang",
storageBucket:"adaluang.firebasestorage.app",
messagingSenderId:"970393246155",
appId:"1:970393246155:web:e2f6971c49d85624acbe4",
measurementId:"G-PNKBBCZLMN"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let role="",register=false,user=null,profile=null;

window.choose=r=>{role=r;register=false;$("roles").classList.add("hidden");$("authform").classList.remove("hidden");$("message").textContent="";updateForm()};
window.back=()=>{$("roles").classList.remove("hidden");$("authform").classList.add("hidden");$("message").textContent=""};
function updateForm(){
$("formtitle").textContent=(register?"Daftar ":"Masuk ")+(role==="guru"?"Ruang Guru":"Ruang Murid");
$("namelabel").classList.toggle("hidden",!register);
$("name").required=register;
$("submit").textContent=register?"Daftar":"Masuk";
$("toggle").textContent=register?"Sudah punya akun? Masuk":"Belum punya akun? Daftar";
}
$("toggle").onclick=()=>{register=!register;updateForm()};
$("authform").onsubmit=async e=>{
e.preventDefault();$("submit").disabled=true;$("message").textContent="Memproses...";
try{
if(register){
const name=$("name").value.trim();if(!name)throw Error("Nama wajib diisi.");
const c=await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
await setDoc(doc(db,"users",c.user.uid),{name,email:c.user.email,role,approved:role==="murid",createdAt:serverTimestamp()});
if(role==="guru"){await signOut(auth);$("message").textContent="Pendaftaran guru berhasil. Menunggu persetujuan admin.";return}
}else await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
}catch(err){$("message").textContent=err.message}
finally{$("submit").disabled=false}
};
$("logout").onclick=()=>signOut(auth);
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
onAuthStateChanged(auth,async u=>{
user=u;if(!u){$("login").classList.remove("hidden");$("dashboard").classList.add("hidden");return}
try{
const s=await getDoc(doc(db,"users",u.uid));
if(!s.exists()){await signOut(auth);alert("Profil akun tidak ditemukan.");return}
profile=s.data();
if(profile.role==="guru"&&!profile.approved){await signOut(auth);alert("Akun guru menunggu persetujuan admin.");return}
$("login").classList.add("hidden");$("dashboard").classList.remove("hidden");
$("welcome").textContent="Halo, "+(profile.name||u.email)+"!";
$("roletext").textContent="Masuk sebagai "+profile.role;
await render();
}catch(e){console.error(e);alert("Gagal memuat data. Periksa konfigurasi dan Security Rules Firebase.")}
});
async function render(){
const c=$("content");
if(profile.role==="admin"){
c.innerHTML=`<div class="panel"><h3>Persetujuan Guru</h3><div id="pending">Memuat...</div></div>
<div class="panel"><h3>Tambah Materi</h3><form id="material"><label>Judul</label><input id="mtitle" required><label>Deskripsi</label><textarea id="mdesc" required></textarea><label>Link materi/PDF</label><input id="murl" type="url" required><button class="primary">Simpan</button></form></div>`;
await pendingTeachers();
$("material").onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,"materials"),{title:$("mtitle").value.trim(),description:$("mdesc").value.trim(),url:$("murl").value.trim(),createdBy:user.uid,createdAt:serverTimestamp()});e.target.reset();alert("Materi disimpan");};
}else if(profile.role==="guru"){
c.innerHTML=`<div class="panel"><h3>Buat Kelas</h3><form id="newclass"><label>Nama kelas</label><input id="cname" required><button class="primary">Buat kelas</button></form></div><div class="panel"><h3>Kelas Saya</h3><div id="classes">Memuat...</div></div><div class="panel"><h3>Materi</h3><div id="materials">Memuat...</div></div>`;
$("newclass").onsubmit=async e=>{e.preventDefault();const code=Math.random().toString(36).slice(2,8).toUpperCase();await addDoc(collection(db,"classes"),{name:$("cname").value.trim(),code,teacherId:user.uid,createdAt:serverTimestamp()});e.target.reset();alert("Kode kelas: "+code);await classes()};
await classes();await materials();
}else if(profile.role==="murid"){
c.innerHTML=`<div class="panel"><h3>Materi Pembelajaran</h3><div id="materials">Memuat...</div></div><div class="panel"><h3>Kelas dan Progres</h3><p>Fitur gabung kelas, kuis, dan pemantauan nilai belum tersedia di versi ini.</p></div>`;
await materials();
}else{c.textContent="Peran akun tidak dikenal."}
}
async function pendingTeachers(){
const el=$("pending"),s=await getDocs(query(collection(db,"users"),where("role","==","guru")));
const ds=s.docs.filter(d=>!d.data().approved);
if(!ds.length){el.textContent="Tidak ada akun menunggu persetujuan.";return}
el.innerHTML=ds.map(d=>`<div class="item"><b>${esc(d.data().name)}</b><br>${esc(d.data().email)}<br><button class="primary" data-id="${d.id}">Setujui</button></div>`).join("");
el.querySelectorAll("button").forEach(b=>b.onclick=async()=>{await setDoc(doc(db,"users",b.dataset.id),{approved:true},{merge:true});await pendingTeachers()});
}
async function classes(){
const el=$("classes"),s=await getDocs(query(collection(db,"classes"),where("teacherId","==",user.uid)));
el.innerHTML=s.empty?"Belum ada kelas.":s.docs.map(d=>`<div class="item"><b>${esc(d.data().name)}</b><br>Kode: ${esc(d.data().code)}</div>`).join("");
}
async function materials(){
const el=$("materials"),s=await getDocs(collection(db,"materials"));
el.innerHTML=s.empty?"Belum ada materi.":s.docs.map(d=>{const m=d.data();return `<div class="item"><b>${esc(m.title)}</b><p>${esc(m.description)}</p><a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">Buka materi</a></div>`}).join("");
}
</script>
</body>
</html>
