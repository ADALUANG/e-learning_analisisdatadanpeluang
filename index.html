
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  getDocs,
  query,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

// KONFIGURASI FIREBASE DARI FIREBASE CONSOLE
const firebaseConfig = {
  apiKey: "AIzaSyDuVGHdk05SzOdTGuXsqfKZZwF1dYsmQDU",
  authDomain: "adaluang.firebaseapp.com",
  projectId: "adaluang",
  storageBucket: "adaluang.firebasestorage.app",
  messagingSenderId: "970393246155",
  appId: "1:970393246155:web:e2f6971c49d85624acbe4e",
  measurementId: "G-PNKBBCZLMN"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let selectedRole = "";
let registerMode = false;
let currentUser = null;
let currentProfile = null;

function showMessage(message) {
  $("auth-message").textContent = message;
}

function getErrorMessage(error) {
  const messages = {
    "auth/api-key-not-valid": "API key Firebase tidak valid. Periksa kembali konfigurasi Firebase.",
    "auth/invalid-api-key": "API key Firebase tidak valid.",
    "auth/invalid-credential": "Email atau kata sandi salah.",
    "auth/invalid-email": "Format email tidak valid.",
    "auth/email-already-in-use": "Email sudah terdaftar. Silakan masuk.",
    "auth/weak-password": "Kata sandi minimal 6 karakter.",
    "auth/operation-not-allowed": "Aktifkan metode Email/Password di Firebase Authentication.",
    "auth/network-request-failed": "Koneksi internet bermasalah."
  };

  return messages[error.code] || error.message || "Terjadi kesalahan.";
}

// Pilih Ruang Guru atau Ruang Murid
window.chooseRole = role => {
  selectedRole = role;

  $("role-selection").classList.add("hidden");
  $("auth-area").classList.remove("hidden");
  $("bottom-switch").classList.add("hidden");

  $("welcome-title").textContent =
    role === "guru" ? "Ruang Guru" : "Ruang Murid";

  $("welcome-subtitle").textContent =
    role === "guru"
      ? "Masuk dengan akun guru atau akun admin yang sudah terdaftar."
      : "Masuk untuk mulai belajar matematika.";

  window.setMode(false);
};

window.backToRoles = () => {
  $("role-selection").classList.remove("hidden");
  $("auth-area").classList.add("hidden");
  $("bottom-switch").classList.remove("hidden");
  $("welcome-title").textContent = "Selamat datang!";
  $("welcome-subtitle").textContent = "Pilih ruang belajarmu.";
  showMessage("");
};

window.setMode = mode => {
  registerMode = mode;

  $("name-field").classList.toggle("hidden", !mode);
  $("fullname").required = mode;

  $("login-tab").classList.toggle("active", !mode);
  $("register-tab").classList.toggle("active", mode);

  $("submit-button").textContent =
    mode ? "Buat Akun ✦" : "Masuk →";

  showMessage("");
};

window.openRegister = () => {
  if (!selectedRole) {
    window.chooseRole("murid");
  }

  window.setMode(true);
};

// Login dan pendaftaran
$("auth-form").addEventListener("submit", async event => {
  event.preventDefault();

  const button = $("submit-button");
  button.disabled = true;
  showMessage("Memproses...");

  try {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (registerMode) {
      // Admin tidak mendaftar melalui formulir publik.
      if (!["guru", "murid"].includes(selectedRole)) {
        throw new Error("Pilih Ruang Guru atau Ruang Murid.");
      }

      const name = $("fullname").value.trim();

      if (!name) {
        throw new Error("Nama lengkap wajib diisi.");
      }

      const credential = await createUserWithEmailAndPassword(
        auth, email, password
      );

      await setDoc(doc(db, "users", credential.user.uid), {
        name,
        email,
        role: selectedRole,
        approved: selectedRole === "murid",
        createdAt: serverTimestamp()
      });

      if (selectedRole === "guru") {
        await signOut(auth);
        showMessage(
          "Pendaftaran berhasil. Akun guru menunggu persetujuan admin."
        );
        window.setMode(false);
      }
    } else {
      // Admin masuk langsung menggunakan akun yang sudah ada.
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (error) {
    showMessage(getErrorMessage(error));
  } finally {
    button.disabled = false;
  }
};

// Tampilan dashboard sesuai role
onAuthStateChanged(auth, async user => {
  currentUser = user;

  if (!user) {
    currentProfile = null;

    $("dashboard").classList.add("hidden");
    $("role-selection").classList.remove("hidden");
    $("auth-area").classList.add("hidden");
    $("bottom-switch").classList.remove("hidden");

    document.querySelectorAll("main > .side").forEach(element => {
      element.classList.remove("hidden");
    });

    document.querySelector(".card").classList.remove("hidden");

    $("welcome-title").textContent = "Selamat datang!";
    $("welcome-subtitle").textContent = "Pilih ruang belajarmu.";
    return;
  }

  try {
    const profileRef = doc(db, "users", user.uid);
    const profileSnapshot = await getDoc(profileRef);

    if (!profileSnapshot.exists()) {
      await signOut(auth);
      alert("Profil akun tidak ditemukan di Firestore.");
      return;
    }

    const profile = profileSnapshot.data();
    currentProfile = profile;

    // Admin tidak perlu persetujuan guru.
    if (profile.role === "guru" && profile.approved !== true) {
      await signOut(auth);
      alert("Akun guru belum disetujui admin.");
      return;
    }

    if (!["admin", "guru", "murid"].includes(profile.role)) {
      await signOut(auth);
      alert("Role akun tidak valid. Periksa data pengguna di Firestore.");
      return;
    }

    $("role-selection").classList.add("hidden");
    $("auth-area").classList.add("hidden");
    $("bottom-switch").classList.add("hidden");

    document.querySelectorAll("main > .side").forEach(element => {
      element.classList.add("hidden");
    });

    document.querySelector(".card").classList.add("hidden");

    $("dashboard").classList.remove("hidden");
    $("dashboard-title").textContent =
      "Halo, " + (profile.name || user.email) + "!";

    $("dashboard-subtitle").textContent =
      profile.role === "admin"
        ? "Dashboard Admin ADALUANG"
        : profile.role === "guru"
          ? "Selamat datang di Ruang Guru."
          : "Selamat belajar di Ruang Murid.";

    await renderDashboard(profile.role);

  } catch (error) {
    console.error(error);
    alert("Gagal memuat profil: " + getErrorMessage(error));
  }
});

function escapeHTML(value = "") {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

async function renderDashboard(role) {
  const container = $("dashboard-content");

  if (role === "admin") {
    container.innerHTML = `
      <div class="panel">
        <h3>Persetujuan Akun Guru</h3>
        <div id="pending">Memuat akun guru...</div>
      </div>

      <div class="panel">
        <h3>Tambah Materi</h3>
        <form id="material-form">
          <label>Judul materi</label>
          <input id="mtitle" required>

          <label>Deskripsi materi</label>
          <input id="mdesc" required>

          <label>Link materi</label>
          <input id="murl" type="url" required>

          <button class="primary" type="submit">Simpan Materi</button>
        </form>
        <p id="material-message" class="message"></p>
      </div>
    `;

    await loadPendingTeachers();

    $("material-form").addEventListener("submit", async event => {
      event.preventDefault();

      try {
        await addDoc(collection(db, "materials"), {
          title: $("mtitle").value.trim(),
          description: $("mdesc").value.trim(),
          url: $("murl").value.trim(),
          createdBy: currentUser.uid,
          createdAt: serverTimestamp()
        });

        $("material-form").reset();
        $("material-message").textContent = "Materi berhasil disimpan.";
      } catch (error) {
        $("material-message").textContent = getErrorMessage(error);
      }
    });

  } else if (role === "guru") {
    container.innerHTML = `
      <div class="panel">
        <h3>Buat Kelas</h3>
        <form id="class-form">
          <label>Nama kelas</label>
          <input id="cname" required placeholder="Contoh: X-1">
          <button class="primary" type="submit">Buat Kelas</button>
        </form>
      </div>
      <div class="panel">
        <h3>Kelas Saya</h3>
        <div id="classes">Memuat kelas...</div>
      </div>
      <div class="panel">
        <h3>Materi Pembelajaran</h3>
        <div id="materials">Memuat materi...</div>
      </div>
    `;

    $("class-form").addEventListener("submit", async event => {
      event.preventDefault();

      try {
        await addDoc(collection(db, "classes"), {
          name: $("cname").value.trim(),
          teacherId: currentUser.uid,
          createdAt: serverTimestamp()
        });

        $("class-form").reset();
        await loadClasses();
      } catch (error) {
        alert(getErrorMessage(error));
      }
    });

    await loadClasses();
    await loadMaterials();

  } else if (role === "murid") {
    container.innerHTML = `
      <div class="panel">
        <h3>Materi Pembelajaran</h3>
        <div id="materials">Memuat materi...</div>
      </div>
    `;

    await loadMaterials();
  }
}

async function loadPendingTeachers() {
  const root = $("pending");

  try {
    const result = await getDocs(
      query(collection(db, "users"), where("role", "==", "guru"))
    );

    const pending = result.docs.filter(item =>
      item.data().approved !== true
    );

    if (pending.length === 0) {
      root.textContent = "Tidak ada akun guru yang menunggu persetujuan.";
      return;
    }

    root.innerHTML = pending.map(item => `
      <div class="item">
        <strong>${escapeHTML(item.data().name || "Guru")}</strong><br>
        ${escapeHTML(item.data().email || "")}<br><br>
        <button class="outline" data-approve="${item.id}">
          Setujui Guru
        </button>
      </div>
    `).join("");

    root.querySelectorAll("[data-approve]").forEach(button => {
      button.addEventListener("click", async () => {
        try {
          // Rules Firestore harus mengizinkan admin mengubah approved.
          const teacherRef = doc(db, "users", button.dataset.approve);
          const teacherSnapshot = await getDoc(teacherRef);

          if (!teacherSnapshot.exists() ||
              teacherSnapshot.data().role !== "guru") {
            throw new Error("Data akun guru tidak valid.");
          }

          await setDoc(teacherRef, { approved: true }, { merge: true });
          await loadPendingTeachers();
        } catch (error) {
          alert("Gagal menyetujui akun: " + getErrorMessage(error));
        }
      });
    });
  } catch (error) {
    root.textContent = "Gagal memuat akun: " + getErrorMessage(error);
  }
}

async function loadClasses() {
  const root = $("classes");

  const result = await getDocs(
    query(
      collection(db, "classes"),
      where("teacherId", "==", currentUser.uid)
    )
  );

  root.innerHTML = result.empty
    ? "Belum ada kelas."
    : result.docs.map(item => `
        <div class="item">
          ${escapeHTML(item.data().name || "Kelas")}
        </div>
      `).join("");
}

async function loadMaterials() {
  const root = $("materials");

  try {
    const result = await getDocs(collection(db, "materials"));

    root.innerHTML = result.empty
      ? "Belum ada materi."
      : result.docs.map(item => {
          const material = item.data();
          const url = String(material.url || "");

          let safeLink = "";
          try {
            const parsed = new URL(url);
            if (["https:", "http:"].includes(parsed.protocol)) {
              safeLink = parsed.href;
            }
          } catch (_) {}

          return `
            <div class="item">
              <strong>${escapeHTML(material.title || "Materi")}</strong>
              <p>${escapeHTML(material.description || "")}</p>
              ${safeLink
                ? `<a href="${escapeHTML(safeLink)}" target="_blank" rel="noopener noreferrer">Buka materi ↗</a>`
                : ""}
            </div>
          `;
        }).join("");
  } catch (error) {
    root.textContent = "Gagal memuat materi: " + getErrorMessage(error);
  }
}

$("logout").addEventListener("click", async () => {
  try {
    await signOut(auth);
  } catch (error) {
    alert(getErrorMessage(error));
  }
});
</script>
